name: 每日量化分析
 on:
   schedule:
     - cron: '0 3 * * *'  # 每天 UTC 3 点（北京时间 11 点）自动运行
   workflow_dispatch:    # 支持手动触发
 jobs:
   run-analysis:
     runs-on: ubuntu-latest
     steps:
       - name: 拉取代码
         uses: actions/checkout@v4
       - name: 设置 R 环境
         uses: r-lib/actions/setup-r@v2
         with:
           r-version: '4.3.0'
       - name: 安装依赖包
         run: |
           Rscript -e "install.packages(c('tidyverse', 'quantmod', 'lubridate'), dependencies = TRUE)"
       - name: 执行分析脚本
         run: |
           # 请替换为你仓库中实际的 R 脚本文件名
           Rscript intraday_analysis.R